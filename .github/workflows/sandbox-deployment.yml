name: 🛝 Sandbox Deployment

on:
  workflow_dispatch:
    inputs:
      deployment-type:
        description: 'Deploy to sandbox from which branch? (staging for release, main for hotfix)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'main'
          - 'staging'

jobs:
  merge-staging-to-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Git config
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Set deployment type
        # The input reaches the shell through an environment variable rather than being
        # templated into the script: `${{ }}` is expanded into the command text before bash
        # runs, so a value containing shell syntax would execute. It is a `choice` input
        # today (main/staging), which is why this is hygiene rather than a live hole.
        env:
          DEPLOYMENT_TYPE_INPUT: ${{ github.event.inputs.deployment-type }}
        run: |
          echo "DEPLOYMENT_TYPE=$DEPLOYMENT_TYPE_INPUT" >> "$GITHUB_ENV"
        shell: bash
      - name: Merge staging into sandbox
        run: |
          git fetch --unshallow
          git switch sandbox
          git pull origin sandbox
          git merge --no-ff "origin/$DEPLOYMENT_TYPE" -m "Merge $DEPLOYMENT_TYPE into sandbox"
          git push origin sandbox
